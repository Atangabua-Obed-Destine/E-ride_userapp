name: ride_sharing_user_app
description: A ride sharing Flutter project.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  get: ^4.7.3
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  http: ^1.6.0
  connectivity_plus: ^7.2.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  country_code_picker: ^3.4.1
  dotted_border: ^3.1.0
  percent_indicator: ^4.2.5
  url_launcher: ^6.3.2
  flutter_html: ^3.0.0-beta.2
  pin_code_fields: ^9.4.0
  flutter_svg: ^2.3.0
  shimmer_animation: ^2.2.2+1
  file_picker: ^11.0.2
  permission_handler: ^12.0.3
  syncfusion_flutter_datepicker: ^34.1.29
  google_maps_flutter: ^2.17.1
  geolocator: ^14.0.2
  flutter_animarker: ^3.2.0
  carousel_slider: ^5.1.2
  shimmer: ^3.0.0
  loading_overlay_pro: ^2.1.1
  modal_bottom_sheet: ^3.0.0
  flutter_widget_from_html_core: ^0.17.2
  flutter_typeahead: ^6.0.0
  dotted_line: ^3.3.0
  autocomplete_textfield: ^2.0.1
  flutter_inappwebview: ^6.1.5
  cached_network_image: ^3.4.1
  flutter_spinkit: ^5.2.2
  dart_pusher_channels: ^1.3.1
  flutter_switch: ^0.3.2
  just_the_tooltip: ^0.0.12
  speech_to_text: 7.4.0
  app_links: ^7.2.0
  share_plus: ^12.0.1
  video_thumbnail: ^0.5.6
  video_player: ^2.11.1
  chewie: ^1.13.1
  firebase_auth: ^6.5.4
  phone_numbers_parser: ^9.0.24
  flutter_keyboard_visibility: ^6.0.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  sign_in_with_apple: ^8.0.0
  flutter_facebook_auth: ^7.1.6
  google_sign_in: ^7.2.0
  app_tracking_transparency: ^2.0.6+1
  play_install_referrer: ^0.6.0
  qr_flutter: ^4.1.0
  google_mlkit_text_recognition: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: "^2.3.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/image/logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/image/logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/language/
    - assets/svg/
    - assets/map/
    - assets/sound/

  fonts:
    - family: SFProText
      fonts:
        - asset: assets/font/sf-pro-text-light.ttf
          weight: 300
        - asset: assets/font/sf-pro-text-regular.ttf
          weight: 400
        - asset: assets/font/sf-pro-text-medium.ttf
          weight: 500
        - asset: assets/font/sf-pro-text-semibold.ttf
          weight: 600
        - asset: assets/font/sf-pro-text-bold.ttf
          weight: 700
        - asset: assets/font/sf-pro-text-heavy.ttf
          weight: 900

    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900
